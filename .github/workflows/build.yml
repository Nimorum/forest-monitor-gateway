name: Build Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Instala dependências de sistema (apenas Ubuntu)
      - name: Install system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - run: pip install pyinstaller pyserial requests python-dotenv

      - name: Build Daemon
        run: pyinstaller --onefile --console --name gateway-daemon src/gateway.py

      - name: Build UI
        run: pyinstaller --onefile --noconsole --paths src --name gateway-ui ui/app.py

      - name: Upload binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*